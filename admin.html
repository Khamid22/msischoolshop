<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Панель администратора — MSI Bot Shop</title>
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>

  <header class="admin-header">
    <div class="admin-header__left">
      <span class="admin-header__logo">MSI</span>
      <span class="admin-header__divider"></span>
      <span class="admin-header__subtitle">Панель администратора</span>
    </div>
    <div class="admin-header__right">
      <button class="admin-header__theme-btn" id="themeToggle" title="Сменить тему (тёмная / чёрно-белая)">☀</button>
      <button class="admin-header__logout-btn" id="logoutBtn" title="Выйти">⏻ Выйти</button>
      <a href="/" class="admin-header__back-btn">На сайт →</a>
    </div>
  </header>

  <main class="admin">

    <!-- ADD / EDIT PRODUCT -->
    <section class="admin-section">
      <h2 class="admin-section__title">
        <span class="admin-section__icon" id="formIcon">＋</span>
        <span id="formTitle">Добавление товара</span>
      </h2>
      <form class="admin-form" id="productForm">
        <input type="hidden" id="editId" value="" />
        <div class="admin-form__row">
          <div class="admin-form__field">
            <label class="admin-form__label" for="pName">Название товара</label>
            <input class="admin-form__input" type="text" id="pName" placeholder="T-Shirt Black Edition" required />
          </div>
          <div class="admin-form__field">
            <label class="admin-form__label" for="pPrice">Цена товара</label>
            <input class="admin-form__input" type="number" id="pPrice" placeholder="750" min="0" required />
          </div>
        </div>
        <div class="admin-form__row">
          <div class="admin-form__field">
            <label class="admin-form__label" for="pDiscount">Скидка (%)</label>
            <input class="admin-form__input" type="number" id="pDiscount" placeholder="0" min="0" max="100" />
          </div>
          <div class="admin-form__field">
            <label class="admin-form__label">&nbsp;</label>
            <div class="admin-form__discount-preview" id="discountPreview" style="display:none;">
              <span class="admin-form__discount-old" id="discountOldPrice"></span>
              <span class="admin-form__discount-new" id="discountNewPrice"></span>
            </div>
          </div>
        </div>
        <div class="admin-form__row">
          <div class="admin-form__field">
            <label class="admin-form__label">Изображение товара</label>
            <div class="admin-upload" id="uploadZone">
              <input type="file" id="pImageFile" accept="image/*" class="admin-upload__input" />
              <div class="admin-upload__dropzone" id="uploadDropzone">
                <span class="admin-upload__icon">📷</span>
                <span class="admin-upload__text">Нажмите или перетащите фото</span>
                <span class="admin-upload__hint">JPG, PNG, SVG — до 5 МБ</span>
              </div>
              <div class="admin-upload__preview" id="uploadPreview" style="display:none;">
                <img id="uploadPreviewImg" class="admin-upload__preview-img" />
                <button type="button" class="admin-upload__remove" id="uploadRemove">✕</button>
              </div>
            </div>
            <input type="hidden" id="pImage" value="" />
          </div>
          <div class="admin-form__field">
            <label class="admin-form__label" for="pType">Тип товара</label>
            <select class="admin-form__select" id="pType" required>
              <option value="" disabled selected>Выберите тип</option>
              <option value="digital">Digital (Цифровой)</option>
              <option value="physical">Physical (Физический)</option>
            </select>
          </div>
        </div>
        <div class="admin-dynamic-fields" id="dynamicFields">
          <div class="admin-dynamic-fields__label">Дополнительные параметры</div>
          <div class="admin-dynamic-fields__group" data-for="physical" style="display:flex;">
            <div class="admin-form__row">
              <div class="admin-form__field">
                <label class="admin-form__label" for="pWeight">Вес товара (г)</label>
                <input class="admin-form__input" type="number" id="pWeight" placeholder="250" min="0" />
              </div>
              <div class="admin-form__field">
                <label class="admin-form__label" for="pStock">Количество на складе</label>
                <input class="admin-form__input" type="number" id="pStock" placeholder="100" min="0" />
              </div>
            </div>
          </div>
          <div class="admin-dynamic-fields__group" data-for="digital" style="display:none;">
            <div class="admin-form__field">
              <label class="admin-form__label" for="pDownload">Ссылка на скачивание / Активацию</label>
              <input class="admin-form__input" type="url" id="pDownload" placeholder="https://example.com/activate?key=..." />
            </div>
            <div class="admin-form__field">
              <label class="admin-form__label" for="pLicense">Текстовый ключ / Лицензия</label>
              <textarea class="admin-form__textarea" id="pLicense" placeholder="XXXXX-XXXXX-XXXXX" rows="3"></textarea>
            </div>
          </div>
        </div>
        <div class="admin-form__row">
          <div class="admin-form__field admin-form__field--checkbox">
            <label class="admin-form__checkbox-label">
              <input class="admin-form__checkbox" type="checkbox" id="pCarousel" />
              <span class="admin-form__checkbox-custom"></span>
              Отображать в карусели на главной
            </label>
          </div>
        </div>
        <div class="admin-form__field">
          <label class="admin-form__label" for="pDesc">Описание товара</label>
          <textarea class="admin-form__textarea" id="pDesc" placeholder="Подробное описание товара..." rows="4"></textarea>
        </div>
        <div class="admin-form__btns">
          <button class="admin-btn admin-btn--primary" type="submit" id="submitBtn">Добавить товар</button>
          <button class="admin-btn admin-btn--secondary" type="button" id="cancelEdit" style="display:none;">Отмена</button>
        </div>
      </form>
    </section>

    <!-- CATALOG -->
    <section class="admin-section">
      <h2 class="admin-section__title">
        <span class="admin-section__icon">▦</span>
        Каталог товаров
      </h2>
      <div class="admin-filters">
        <div class="admin-filters__search">
          <input class="admin-form__input" type="text" id="searchInput" placeholder="Поиск по названию..." />
        </div>
        <div class="admin-filters__group">
          <select class="admin-form__select" id="filterType">
            <option value="all">Все типы</option>
            <option value="digital">Digital</option>
            <option value="physical">Physical</option>
          </select>
          <input class="admin-form__input admin-form__input--small" type="number" id="filterMin" placeholder="Мин. цена" min="0" />
          <input class="admin-form__input admin-form__input--small" type="number" id="filterMax" placeholder="Макс. цена" min="0" />
          <button class="admin-btn admin-btn--secondary" type="button" id="applyFilters">Применить</button>
        </div>
      </div>
      <div id="catalogCategories"></div>
    </section>

  </main>

  <footer class="admin-footer">
    <span>© 2026 MSI Bot Shop — Admin Panel</span>
  </footer>

  <script>
    /* ============ AUTH ============ */
    if (localStorage.getItem('msi_admin_auth') !== '1') {
      window.location.href = '/admin-login.html';
    }

    var AUTH_KEY = 'msi_admin_auth';
    var STORE_KEY = 'msi_products';

    /* ============ API (localStorage — swap to fetch for backend) ============ */
    function apiGetProducts()  { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]') || []; }
    function apiSaveProducts(l){ localStorage.setItem(STORE_KEY, JSON.stringify(l)); }
    function apiLogout()       { localStorage.removeItem(AUTH_KEY); window.location.href = '/admin-login.html'; }

    /* ============ THEME ============ */
    var themeBtn = document.getElementById('themeToggle');
    themeBtn.addEventListener('click', function() {
      var html = document.documentElement;
      var dark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', dark ? 'light' : 'dark');
      themeBtn.textContent = dark ? '☾' : '☀';
    });

    document.getElementById('logoutBtn').addEventListener('click', apiLogout);

    /* ============ DYNAMIC FIELDS ============ */
    var pType = document.getElementById('pType');
    var dynGroups = document.querySelectorAll('.admin-dynamic-fields__group');

    function switchFields(type) {
      dynGroups.forEach(function(g) {
        var show = g.getAttribute('data-for') === type;
        g.style.display = show ? 'flex' : 'none';
        g.classList.toggle('admin-dynamic-fields__group--visible', show);
        g.classList.toggle('admin-dynamic-fields__group--hidden', !show);
      });
    }
    pType.addEventListener('change', function() { switchFields(pType.value); });
    switchFields('physical');

    /* ============ IMAGE UPLOAD ============ */
    var uploadInput = document.getElementById('pImageFile');
    var uploadDropzone = document.getElementById('uploadDropzone');
    var uploadPreview = document.getElementById('uploadPreview');
    var uploadPreviewImg = document.getElementById('uploadPreviewImg');
    var uploadRemove = document.getElementById('uploadRemove');
    var pImageHidden = document.getElementById('pImage');

    function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return;
      if (file.size > 5 * 1024 * 1024) { alert('Файл слишком большой (макс. 5 МБ)'); return; }
      var reader = new FileReader();
      reader.onload = function(e) {
        pImageHidden.value = e.target.result;
        uploadPreviewImg.src = e.target.result;
        uploadDropzone.style.display = 'none';
        uploadPreview.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    }

    uploadInput.addEventListener('change', function() {
      if (uploadInput.files && uploadInput.files[0]) handleFile(uploadInput.files[0]);
    });

    uploadDropzone.addEventListener('click', function() { uploadInput.click(); });

    uploadDropzone.addEventListener('dragover', function(e) { e.preventDefault(); uploadDropzone.classList.add('admin-upload__dropzone--hover'); });
    uploadDropzone.addEventListener('dragleave', function() { uploadDropzone.classList.remove('admin-upload__dropzone--hover'); });
    uploadDropzone.addEventListener('drop', function(e) {
      e.preventDefault();
      uploadDropzone.classList.remove('admin-upload__dropzone--hover');
      if (e.dataTransfer.files && e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]);
    });

    uploadRemove.addEventListener('click', function() {
      pImageHidden.value = '';
      uploadInput.value = '';
      uploadPreviewImg.src = '';
      uploadDropzone.style.display = '';
      uploadPreview.style.display = 'none';
    });

    function clearUpload() {
      pImageHidden.value = '';
      uploadInput.value = '';
      uploadPreviewImg.src = '';
      uploadDropzone.style.display = '';
      uploadPreview.style.display = 'none';
    }

    /* ============ PRODUCT FORM ============ */
    var form = document.getElementById('productForm');
    var editId = document.getElementById('editId');
    var formTitle = document.getElementById('formTitle');
    var formIcon = document.getElementById('formIcon');
    var submitBtn = document.getElementById('submitBtn');
    var cancelBtn = document.getElementById('cancelEdit');

    form.addEventListener('submit', function(e) {
      e.preventDefault();
      if (!document.getElementById('pImage').value.trim()) {
        alert('Добавьте изображение товара');
        return;
      }
      var discount = Number(document.getElementById('pDiscount').value) || 0;
      if (discount < 0) discount = 0;
      if (discount > 100) discount = 100;
      var data = {
        name: document.getElementById('pName').value.trim(),
        price: Number(document.getElementById('pPrice').value),
        image: document.getElementById('pImage').value.trim(),
        type: pType.value,
        description: document.getElementById('pDesc').value.trim(),
        carousel: document.getElementById('pCarousel').checked,
        downloadUrl: document.getElementById('pDownload').value.trim(),
        licenseKey: document.getElementById('pLicense').value.trim(),
        weight: Number(document.getElementById('pWeight').value) || 0,
        stock: Number(document.getElementById('pStock').value) || 0,
        discount: discount
      };

      var list = apiGetProducts();

      if (editId.value) {
        var idx = list.findIndex(function(p) { return p.id === editId.value; });
        if (idx !== -1) Object.assign(list[idx], data);
      } else {
        data.id = 'product-' + Date.now() + '-' + Math.random().toString(36).slice(2, 7);
        data.nameKey = '';
        data.descKey = '';
        list.push(data);
      }

      apiSaveProducts(list);
      resetForm();
      renderCatalog();
    });

    cancelBtn.addEventListener('click', resetForm);

    function resetForm() {
      form.reset();
      editId.value = '';
      formTitle.textContent = 'Добавление товара';
      formIcon.textContent = '＋';
      submitBtn.textContent = 'Добавить товар';
      cancelBtn.style.display = 'none';
      switchFields('physical');
      updateDiscountPreview();
      clearUpload();
    }

    function startEdit(id) {
      var p = apiGetProducts().find(function(x) { return x.id === id; });
      if (!p) return;
      editId.value = p.id;
      document.getElementById('pName').value = p.name || '';
      document.getElementById('pPrice').value = p.price || '';
      pImageHidden.value = p.image || '';
      if (p.image) {
        uploadPreviewImg.src = p.image;
        uploadDropzone.style.display = 'none';
        uploadPreview.style.display = 'flex';
      } else {
        clearUpload();
      }
      pType.value = p.type || 'physical';
      switchFields(p.type || 'physical');
      document.getElementById('pDesc').value = p.description || '';
      document.getElementById('pCarousel').checked = !!p.carousel;
      document.getElementById('pDownload').value = p.downloadUrl || '';
      document.getElementById('pLicense').value = p.licenseKey || '';
      document.getElementById('pWeight').value = p.weight || '';
      document.getElementById('pStock').value = p.stock || '';
      document.getElementById('pDiscount').value = p.discount || '';
      updateDiscountPreview();
      formTitle.textContent = 'Редактирование товара';
      formIcon.textContent = '✎';
      submitBtn.textContent = 'Сохранить';
      cancelBtn.style.display = 'inline-flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteProduct(id) {
      if (!confirm('Удалить товар?')) return;
      apiSaveProducts(apiGetProducts().filter(function(p) { return p.id !== id; }));
      renderCatalog();
    }

    /* ============ CATALOG ============ */

    function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    function renderCatalog() {
      var products = apiGetProducts();
      var search = document.getElementById('searchInput').value.toLowerCase();
      var type = document.getElementById('filterType').value;
      var minP = Number(document.getElementById('filterMin').value) || 0;
      var maxP = Number(document.getElementById('filterMax').value) || Infinity;

      var filtered = products.filter(function(p) {
        if (search && (p.name || '').toLowerCase().indexOf(search) === -1) return false;
        if (type !== 'all' && p.type !== type) return false;
        if (p.price < minP || p.price > maxP) return false;
        return true;
      });

      var html = '';
      if (filtered.length) {
        html += '<div class="admin-table-wrap"><table class="admin-table"><thead><tr>';
        html += '<th>Название</th><th>Тип</th><th>Цена</th><th>Скидка</th><th>В карусели</th><th>Действия</th>';
        html += '</tr></thead><tbody>';
        filtered.forEach(function(p) {
          var tag = p.type === 'digital'
            ? '<span class="admin-tag admin-tag--digital">Digital</span>'
            : '<span class="admin-tag admin-tag--physical">Physical</span>';
          var discount = p.discount || 0;
          var priceHtml = '';
          if (discount > 0) {
            var newPrice = Math.round(p.price * (1 - discount / 100));
            priceHtml = '<span class="admin-table__price-old">⭐ ' + p.price + '</span> <span class="admin-table__price-sale">⭐ ' + newPrice + '</span>';
          } else {
            priceHtml = '⭐ ' + p.price;
          }
          var discountHtml = discount > 0
            ? '<span class="admin-tag admin-tag--discount">-' + discount + '%</span>'
            : '—';
          html += '<tr>';
          html += '<td class="admin-table__name">' + esc(p.name || p.id) + '</td>';
          html += '<td>' + tag + '</td>';
          html += '<td class="admin-table__price">' + priceHtml + '</td>';
          html += '<td>' + discountHtml + '</td>';
          html += '<td>' + (p.carousel ? '<span class="admin-table__check">✓</span>' : '—') + '</td>';
          html += '<td class="admin-table__actions">';
          html += '<button class="admin-btn admin-btn--edit" data-action="edit" data-id="' + p.id + '">Редактировать</button>';
          html += '<button class="admin-btn admin-btn--danger" data-action="delete" data-id="' + p.id + '">Удалить</button>';
          html += '</td></tr>';
        });
        html += '</tbody></table></div>';
      }

      document.getElementById('catalogCategories').innerHTML = html || '<div class="admin-empty">Нет товаров</div>';
    }

    document.getElementById('catalogCategories').addEventListener('click', function(e) {
      var btn = e.target.closest('[data-action]');
      if (!btn) return;
      if (btn.dataset.action === 'edit') startEdit(btn.dataset.id);
      if (btn.dataset.action === 'delete') deleteProduct(btn.dataset.id);
    });

    document.getElementById('applyFilters').addEventListener('click', renderCatalog);
    document.getElementById('searchInput').addEventListener('input', renderCatalog);

    /* ============ DISCOUNT PREVIEW ============ */
    var pDiscount = document.getElementById('pDiscount');
    var discountPreview = document.getElementById('discountPreview');
    var discountOldPrice = document.getElementById('discountOldPrice');
    var discountNewPrice = document.getElementById('discountNewPrice');

    function updateDiscountPreview() {
      var price = Number(document.getElementById('pPrice').value) || 0;
      var disc = Number(pDiscount.value) || 0;
      if (disc > 0 && price > 0) {
        var newPrice = Math.round(price * (1 - disc / 100));
        discountOldPrice.textContent = '⭐ ' + price;
        discountNewPrice.textContent = '⭐ ' + newPrice;
        discountPreview.style.display = 'flex';
      } else {
        discountPreview.style.display = 'none';
      }
    }

    pDiscount.addEventListener('input', updateDiscountPreview);
    document.getElementById('pPrice').addEventListener('input', updateDiscountPreview);

    /* ============ INIT ============ */
    renderCatalog();
  </script>

</body>
</html>
