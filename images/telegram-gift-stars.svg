<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="400" height="250" fill="url(#bg)" rx="12"/>
  <!-- Small decorative stars -->
  <polygon points="30,40 33,50 43,50 35,56 38,66 30,60 22,66 25,56 17,50 27,50" fill="#FFD700" opacity="0.3" filter="url(#glow)"/>
  <polygon points="370,50 372,56 378,56 373,60 375,66 370,62 365,66 367,60 362,56 368,56" fill="#FFD700" opacity="0.4" filter="url(#glow)"/>
  <polygon points="50,200 52,206 58,206 53,210 55,216 50,212 45,216 47,210 42,206 48,206" fill="#FFD700" opacity="0.25" filter="url(#glow)"/>
  <polygon points="350,180 352,186 358,186 353,190 355,196 350,192 345,196 347,190 342,186 348,186" fill="#FFD700" opacity="0.35" filter="url(#glow)"/>
  <!-- Main star -->
  <g transform="translate(200, 100) scale(1.2)" filter="url(#glow)">
    <polygon points="0,-50 14,-18 48,-18 22,4 30,38 0,20 -30,38 -22,4 -48,-18 -14,-18" fill="url(#star)" stroke="#B8860B" stroke-width="1.5"/>
    <!-- Inner star highlight -->
    <polygon points="0,-35 10,-12 34,-12 16,3 21,27 0,14 -21,27 -16,3 -34,-12 -10,-12" fill="#FFD700" opacity="0.5"/>
  </g>
  <!-- Telegram gift box icon -->
  <g transform="translate(170, 140)">
    <rect x="0" y="15" width="60" height="40" rx="4" fill="#2AABEE" stroke="#1a8ac4" stroke-width="1.5"/>
    <rect x="27" y="15" width="6" height="40" fill="#1a8ac4"/>
    <rect x="0" y="15" width="60" height="8" rx="2" fill="#3BB8F0"/>
    <path d="M30 15 C20 0, 10 5, 15 15" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M30 15 C40 0, 50 5, 45 15" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Text -->
  <text x="200" y="215" text-anchor="middle" fill="#FFD700" font-family="Arial, sans-serif" font-size="18" font-weight="bold" letter-spacing="1">GIFT STARS</text>
</svg>
