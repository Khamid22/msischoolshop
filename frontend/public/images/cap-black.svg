<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250">
  <rect width="400" height="250" fill="#111111" rx="12"/>
  <!-- Cap shape -->
  <g transform="translate(100, 50)">
    <!-- Brim -->
    <ellipse cx="100" cy="130" rx="100" ry="20" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <!-- Crown -->
    <path d="M30 130 C30 60, 100 20, 170 60 L170 130" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
    <!-- Panel line -->
    <path d="M100 35 L100 130" stroke="#222" stroke-width="0.8"/>
    <!-- Button on top -->
    <circle cx="100" cy="35" r="4" fill="#222" stroke="#333" stroke-width="0.5"/>
    <!-- Brim edge -->
    <path d="M0 130 C20 128, 180 128, 200 130" fill="none" stroke="#444" stroke-width="1.5"/>
  </g>
  <!-- Subtle label -->
  <text x="200" y="230" text-anchor="middle" fill="#333" font-family="Arial, sans-serif" font-size="11" letter-spacing="2">CAP</text>
</svg>
